<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>AXERO1 CORE - Giriş</title>
    <style>
        body { background: #0b0f19; color: #f3f4f6; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #111827; padding: 30px; border-radius: 8px; border: 1px solid #1f2937; width: 320px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { color: #00ffcc; text-align: center; font-size: 18px; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin-bottom: 12px; background: #030712; border: 1px solid #374151; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; background: #00ffcc; color: #030712; border: none; padding: 10px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        button:hover { background: #00b388; }
        .error { color: #ef4444; font-size: 12px; text-align: center; margin-bottom: 10px; }
        .link { text-align: center; margin-top: 15px; font-size: 12px; }
        .link a { color: #00ffcc; text-decoration: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>⬡ AXERO1 CORE GİRİŞ</h2>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <input type="email" name="email" placeholder="E-Posta Adresi" required>
            <input type="password" name="password" placeholder="Şifre" required>
            <button type="submit">GİRİŞ YAP</button>
        </form>
        <div class="link">
            Hesabın yok mu? <a href="/register">Kayıt Ol</a>
        </div>
    </div>
</body>
</html>
