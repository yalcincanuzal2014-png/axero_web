<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>AXERO1 CORE - Web OSINT Suite</title>
    <style>
        body { background: #0b0f19; color: #f3f4f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #111827; height: 60px; display: flex; justify-content: space-between; align-items: center; padding: 0 25px; border-bottom: 1px solid #1f2937; }
        header h1 { color: #00ffcc; font-size: 16px; margin: 0; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        sidebar { width: 350px; background: #111827; border-right: 1px solid #1f2937; overflow-y: auto; padding: 15px; }
        .module-btn { width: 100%; background: #1f2937; color: #f3f4f6; border: none; padding: 10px 15px; text-align: left; margin-bottom: 6px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; transition: 0.2s; }
        .module-btn:hover { background: #374151; color: #00ffcc; }
        .content-pane { flex: 1; background: #030712; padding: 20px; display: flex; flex-direction: column; }
        #console { flex: 1; background: #030712; color: #00ffcc; font-family: 'Consolas', monospace; font-size: 13px; border: 1px solid #1f2937; border-radius: 8px; padding: 15px; overflow-y: auto; white-space: pre-wrap; }
        .logout-btn { background: #ef4444; color: white; padding: 6px 12px; border-radius: 4px; text-decoration: none; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <h1>⬡ AXERO1 CORE // WEB INTELLIGENCE SUITE</h1>
        <div>
            Oturum: <b>@{{ nick }}</b> | Yetki: <span style="color: #00ffcc;">{{ tier }}</span>
            <a href="/logout" class="logout-btn" style="margin-left: 20px;">Çıkış</a>
        </div>
    </header>

    <div class="main-container">
        <sidebar>
            <div style="font-size: 11px; color: #6b7280; font-weight: bold; margin-bottom: 10px;">OSINT MODÜLLERİ:</div>
            <button class="module-btn" onclick="calistir(1, 'Web Adresi girin:')">1. Web Erişim Testi [FREE]</button>
            <button class="module-btn" onclick="calistir(2, 'IP Adresi girin:')">2. IP Konum Analizi [FREE]</button>
            <button class="module-btn" onclick="calistir(3, 'Domain girin (örn: google.com):')">3. Subdomain Taraması [PRO]</button>
            <button class="module-btn" onclick="calistir(6, 'Kullanıcı adı / Nick girin:')">6. Sosyal Medya / Nick [PRO]</button>
            <button class="module-btn" onclick="calistir(11, 'Bölge girin (örn: Istanbul):')">11. Bölge Kamera İstihbaratı [VIP]</button>
            <button class="module-btn" onclick="calistir(13, 'Onion link girin:')">13. Dark Web (.onion) Taraması [VIP]</button>
            <button class="module-btn" onclick="calistir(15, 'Kripto Cüzdan Adresi girin:')">15. Kripto Cüzdan Takibi [VIP]</button>
        </sidebar>

        <div class="content-pane">
            <div id="console">[*] Web İstihbarat Konsolu Hazır. Sol menüden bir modül seçin...\n</div>
        </div>
    </div>

    <script>
        function calistir(modId, promptText) {
            let hedef = prompt(promptText);
            if (!hedef) return;

            let con = document.getElementById("console");
            con.innerText += `\n[~] Modül ${modId} başlatılıyor... Hedef: ${hedef}\n`;
            con.scrollTop = con.scrollHeight;

            fetch('/run_module', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mod_id: modId, target: hedef })
            })
            .then(res => res.json())
            .then(data => {
                con.innerText += data.result + "\n\n";
                con.scrollTop = con.scrollHeight;
            })
            .catch(err => {
                con.innerText += `[!] Hata oluştu: ${err}\n\n`;
            });
        }
    </script>
</body>
</html>
